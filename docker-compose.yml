services:
  fan-control:
    image: ghcr.io/st-devpt/rack-fan-control:2   # the major version: fixes and features, never a breaking change
    container_name: fan-control
    restart: unless-stopped
    stop_grace_period: 60s        # time to hand every fan back to its BMC on `docker stop`
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data              # owned by uid 1000: mkdir data && chown 1000:1000 data
    environment:
      WEB_PASSWORD: change-me     # dashboard password; leave empty to disable sign-in
      CHECK_INTERVAL: 15          # seconds between readings (minimum 5)
      TZ: Europe/Lisbon           # time zone for quiet hours and the event log
      # Servers are added in the dashboard. They can also be declared here, which makes
      # them read-only in the dashboard:
      # SERVER_1_NAME: Rack A
      # SERVER_1_DRIVER: dell      # dell, supermicro, ilo4-unlocked, redfish, ipmi or demo
      # SERVER_1_HOST: 192.168.1.120
      # SERVER_1_USERNAME: root
      # SERVER_1_PASSWORD: calvin
      # Tokens for Prometheus and the Homarr widgets are created in the dashboard. These work too:
      # METRICS_TOKEN: a-long-random-string
      # EMBED_TOKEN: another-random-string
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
