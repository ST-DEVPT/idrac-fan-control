<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Fan Control</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/i18n.js"></script>
</head>
<body class="login">
<main>
  <form class="box" id="form">
    <div class="mark"><img src="/static/icon.svg" alt=""><span>Fan Control</span></div>
    <h1>Sign in</h1>
    <p>This dashboard controls your servers' fans.</p>
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required autofocus>
    <label class="check"><input type="checkbox" id="remember"> Keep me signed in for 30 days</label>
    <button id="submit">Sign in</button>
    <div class="error" id="error" role="alert"></div>
  </form>
</main>
<footer>The password is set with the WEB_PASSWORD environment variable.</footer>
<script src="/static/login.js"></script>
</body>
</html>
