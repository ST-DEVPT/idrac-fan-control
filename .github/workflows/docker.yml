name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to a commit, not a tag that can move; Dependabot keeps them current.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
      - name: Python (ruff)
        run: pip install ruff==0.16.10 && ruff check .
      - name: JavaScript parses, and the scripts of each page share no name twice
        run: |
          for f in web/*.js; do node --check "$f"; done
          node -e '
            const fs = require("fs"), pages = {
              "index.html": ["util", "i18n", "app", "editor", "alerts", "integrations"],
              "embed.html": ["util", "i18n", "embed"], "login.html": ["util", "i18n", "login"] };
            for (const [page, files] of Object.entries(pages))
              new Function(files.map(f => fs.readFileSync(`web/${f}.js`, "utf8")).join(";"));'
      - name: Shell (shellcheck)
        run: shellcheck scripts/fan-guard.sh
      - name: Grafana dashboard is valid JSON
        run: python -m json.tool web/grafana.json > /dev/null
      - name: Prometheus alert rules
        run: docker run --rm -v "$PWD/web:/w:ro" --entrypoint promtool prom/prometheus:latest check rules /w/prometheus-alerts.yml

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v

  container:
    # build the image; prove it starts, serves, controls a demo server, hands the fans back on stop,
    # carries no known fixable vulnerability, and that the pages work in a real browser
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - run: docker build -t fanctl:test .
      - name: Start with a demo server and sign-in
        run: |
          mkdir data && sudo chown 1000:1000 data
          docker run -d --name fanctl -p 8080:8080 -v "$PWD/data:/data" \
            -e WEB_PASSWORD=ci -e VIEW_PASSWORD=view -e SERVER_1_HOST=demo -e CHECK_INTERVAL=5 \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true fanctl:test
      - name: Check it answers
        run: |
          for i in $(seq 30); do curl -fs localhost:8080/livez && break; sleep 1; done
          curl -fs localhost:8080/healthz
          curl -fs localhost:8080/login | grep -q "Sign in"
          curl -fs -c jar -H 'Content-Type: application/json' -d '{"password":"ci"}' localhost:8080/api/login
          curl -fs -b jar localhost:8080/api/overview | grep -q '"driver": "demo"'
          docker exec fanctl ipmitool -V
          docker exec fanctl ssh -V
      - name: Docker reports it healthy
        run: |
          for i in $(seq 60); do [ "$(docker inspect -f '{{.State.Health.Status}}' fanctl)" = healthy ] && exit 0; sleep 2; done
          docker inspect -f '{{json .State.Health}}' fanctl; exit 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"
      - name: Browser tests
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
          FANCTL_URL=http://localhost:8080 FANCTL_PASSWORD=ci FANCTL_VIEWER=view python -m unittest discover -s e2e -v
      - name: docker stop hands the fans back
        run: |
          docker stop -t 60 fanctl
          docker logs fanctl 2>&1 | grep -q "handing fans back to automatic control"
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: fanctl:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - if: always()
        run: docker logs fanctl

  image:
    needs: [container]
    # images are only published from main (latest) and version tags
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # a software bill of materials and build provenance travel with the image
          sbom: true
          provenance: mode=max

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Publish the CHANGELOG section as the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          # a tag without its CHANGELOG section is a release nobody can read: refuse it
          test -s notes.md || { echo "CHANGELOG.md has no section for ${TAG#v}"; exit 1; }
          gh release create "$TAG" --title "$TAG" --notes-file notes.md
